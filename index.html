<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>King Decision Hub • Film & Oyun Reels</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

  <!-- Üst Bar -->
  <header class="app-header">
    <div class="brand">
      <i class="fa-solid fa-crown brand-icon"></i>
      <span>KING<span class="highlight">DECIDE</span></span>
    </div>

    <div class="mode-switch">
      <button id="btn-movies" class="mode-btn active"><i class="fa-solid fa-film"></i> Filmler</button>
      <button id="btn-games" class="mode-btn"><i class="fa-solid fa-gamepad"></i> Oyunlar</button>
    </div>

    <button id="btn-open-watchlist" class="watchlist-toggle-btn">
      <i class="fa-solid fa-star"></i>
      <span id="watchlist-count">0</span>
    </button>
  </header>

  <!-- Ana Reels Alanı -->
  <main class="main-stage">
    <div class="card-container" id="card-container">
      <!-- Kartlar Buraya Dinamik Gelecek -->
    </div>

    <!-- Alt Etkileşim Butonları -->
    <div class="actions-bar">
      <button id="btn-skip" class="action-btn skip" title="Pas Geç"><i class="fa-solid fa-xmark"></i></button>
      <button id="btn-trailer" class="action-btn trailer" title="Fragman Ara"><i class="fa-solid fa-play"></i></button>
      <button id="btn-star" class="action-btn star" title="Favorilere Ekle"><i class="fa-solid fa-star"></i></button>
    </div>
  </main>

  <!-- ⭐ Kaydedilenler Modalı -->
  <div id="watchlist-modal" class="modal-overlay hidden">
    <div class="modal-content glass-card">
      <div class="modal-header">
        <h2><i class="fa-solid fa-star" style="color: #fbbf24;"></i> İzlenecekler & Oynanacaklar Listem</h2>
        <button id="btn-close-watchlist" class="close-btn">&times;</button>
      </div>
      <div class="modal-body" id="watchlist-items">
        <!-- Yıldızlanan İçerikler -->
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
